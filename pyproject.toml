[project]
name = "platform-template-bootstrap"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "gitpython>=3.1.46",
    "pyyaml>=6.0.3",
    "rich>=14.3.3",
    "typer>=0.24.1",
]

[dependency-groups]
dev = [
    "black>=26.1.0",
    "pytest>=9.0.2",
    "ruff>=0.15.4",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.black]
line-length = 100


[project.scripts]
execplan-lint = "platform_tools.execplan_lint:main"
security-scan = "platform_tools.security_scan:main"
agent-score = "platform_tools.agent_score:main"

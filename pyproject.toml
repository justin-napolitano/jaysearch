[project]
name = "platform-template-bootstrap"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "gitpython>=3.1.46",
    "pyyaml>=6.0.3",
    "rich>=14.3.3",
    "typer>=0.24.1",
]

[dependency-groups]
dev = [
    "black>=26.1.0",
    "pytest>=9.0.2",
    "ruff>=0.15.4",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.black]
line-length = 100


[project.scripts]
bootstrap-project = "platform_tools.bootstrap_project:main"
execplan-lint = "platform_tools.execplan_lint:main"
execplan-test = "platform_tools.spec_test_runner:main"
execplan-validate = "platform_tools.execplan_lint:main"
sync-todos = "platform_tools.sync_todos:main"
repo-health-check = "platform_tools.repo_health:main"
run-local-ci = "platform_tools.run_local_ci:main"
governance-loader-check = "platform_tools.governance_loader:main"
governance-check = "platform_tools.governance_check:main"
distribution-check = "platform_tools.distribution_check:main"
adoption-check = "platform_tools.adoption_check:main"
kernel-contract-check = "platform_tools.kernel_contracts:main"
finalize-execplan = "platform_tools.finalize_execplan:main"
security-scan = "platform_tools.security_scan:main"
agent-score = "platform_tools.agent_score:main"
planner = "platform_tools.planner_cli:main"

version: v1
last_updated: 2026-03-11
move_set:
  allowed:
    - read_repository
    - draft_execplan
    - edit_in_scope_files
    - run_deterministic_validators
    - emit_machine_readable_reports
  forbidden:
    - finalize_execplan
    - bypass_branch_protection
    - commit_execplan_implementation_directly_to_main
    - modify_governance_without_approved_execplan
    - forge_signature_or_signed_metadata
    - suppress_required_referee_evidence
execution_constraints:
  execplan_branch_review_required: true
  required_branch_format: "draft-execplan/<plan-id>-<agent>-YYYYMMDD"
  implementation_branch_format: "impl-execplan/<plan-id>-<agent>-YYYYMMDD"
  queue_branch_format: "queue-execplan/<queue-name>-<agent>-YYYYMMDD"
  disallow_execplan_changes_on_main: true
  require_distinct_implementation_branch_per_parallel_execplan: true
  forbid_shared_execution_branch_for_parallel_slices: true
  queue_branches_are_integration_only: true
  governed_execplan_finalization_requires_signed_merge_commit: true
  governed_execplan_finalization_uses_merge_commit_authority: true
  board_review_surface_is_projection_only: true
  provider_sync_field_map_required_for_live_board_sync: true
  provider_sync_existing_project_requires_board_reuse: true
  provider_sync_known_item_ids_require_update_preference: true
  human_operations_runtime_must_be_takeover_safe: true
  downstream_slices_must_treat_completed_provider_sync_as_baseline: true
  allowed_branch_patterns:
    - draft-execplan/*
    - impl-execplan/*
    - queue-execplan/*
    - feature/*
    - docs/*
    - hotfix/*
    - release/*
agent_commit_identity:
  codex_commit_prefix: "[agent/codex-01]"
  required_trailer_format: "Agent: agent/<agent-name>"
  codex_commit_command: "bin/codex-commit"
hostile_review:
  branch_format: "draft-execplan/hostile-review-<agent>-YYYYMMDD"
  artifacts_required:
    - artifacts/review/hostile-review-report.json
    - artifacts/review/hostile-review-summary.md
    - artifacts/review/validation-evidence.json
  required_command_order:
    - bin/execplan-validate .agent/execplans/*.md
    - bin/sync-todos
    - bin/repo-health-check
    - bin/execplan-test
    - bin/run-local-ci
  reject_if_missing_artifacts: true
  reject_if_order_violated: true
turn_protocol:
  - declare_active_plan_id
  - declare_intended_moves
  - execute_moves
  - run_required_referee_checks
  - record_evidence
  - update_plan_progress_and_logs
freeze:
  implementation_blocked_until_ruleset_approved: true
  approval_requirements:
    - update_rules_status_to_APPROVED-RULESET
    - ssh_signed_human_commit
    - commit_message_contains: "Metadata: Ruleset: agent-game-rules-v1"
    - commit_message_contains: "Signed-off-by:"

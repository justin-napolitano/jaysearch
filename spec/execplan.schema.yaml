version: v1
last_updated: 2026-03-04
canonical_identity:
  plan_key_format: "YYYYMMDD-<plan-name>-<owner>-execplan"
  filename_format: "YYYYMMDD-<plan-name>-<owner>-execplan.md"
frontmatter:
  required:
    - id
    - title
    - owner
    - created
    - status
    - base_branch
    - changes
    - approve_policy
    - reviewers
    - finalized_by
    - finalized_at
    - finalized_in_pr
  optional:
    - draft_by
    - draft_branch
    - draft_created
    - initiative_branch
    - initiative_node_id
    - graph_registration
    - validation
    - tasks
    - depends_on
sections_required:
  - Outcomes & Retrospective
  - Context and Orientation
  - Plan of Work
  - Validation and Acceptance
  - Artifacts and Notes
constraints:
  status_allowed:
    - draft
    - proposed
    - approved
    - executing
    - completed
    - archived
  draft_status_only_for_agents: true
  max_tasks: 20
  draft_ttl_days: 14
  changes_must_be_explicit_paths: true
identity_validation:
  filename_stem_must_equal_frontmatter_id: true
  draft_branch_name_format: "draft-execplan/<plan-id>-<agent>-YYYYMMDD"

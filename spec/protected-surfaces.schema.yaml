version: v1
surface_entries:
  - id: execplan_surface
    surface_class: canonical_state_surface
    authority_role: canonical_local
    path_prefixes:
      - .agent/execplans/
  - id: remaining_work_graph_surface
    surface_class: canonical_state_surface
    authority_role: canonical_local
    path_exact:
      - artifacts/planner/research/remaining-work-graph.json
      - artifacts/planner/research/rule-graph.json
  - id: queue_projection_surface
    surface_class: projection_surface
    authority_role: projection_only
    path_exact:
      - docs/queued-execplans.md
  - id: rule_surface
    surface_class: rule_surface
    authority_role: governance_local
    path_exact:
      - docs/commands.md
      - docs/getting-started.md
      - docs/governance.md
      - docs/agent-game-rules-v1.md
      - docs/platform-definition-v1.md
      - docs/platform-overview.md
      - docs/repo-health.md
      - docs/rules-architecture.md
      - docs/subgame-branch-governance.md
      - docs/todos.md
      - spec/governance.yaml
      - spec/remaining-work-graph.schema.yaml
      - spec/rule-graph.schema.yaml
      - spec/rule-registry.yaml
      - spec/ruleset.yaml
      - spec/state-transition-legality.schema.yaml
      - spec/subgame-branch-contract.yaml
      - spec/workflow.yaml
  - id: capability_policy_surface
    surface_class: capability_policy_surface
    authority_role: governance_local
    path_exact:
      - docs/agent-capability-boundaries.md
      - spec/agent-capability-policy.yaml
      - spec/protected-surfaces.schema.yaml
  - id: referee_surface
    surface_class: referee_surface
    authority_role: governance_local
    path_exact:
      - bin/anti-cheat-check
      - bin/merge-readiness-check
      - bin/policy-compliance-check
      - bin/policy-compliance-smoke-test
      - bin/rule-graph-check
      - bin/rule-graph-smoke-test
      - bin/state-transition-legality-check
      - bin/state-transition-legality-smoke-test
      - src/platform_tools/anti_cheat_check.py
      - src/platform_tools/branch_policy.py
      - src/platform_tools/execplan_discovery.py
      - src/platform_tools/game_status.py
      - src/platform_tools/governance_check.py
      - src/platform_tools/governance_loader.py
      - src/platform_tools/merge_readiness.py
      - src/platform_tools/orchestrator_status.py
      - src/platform_tools/policy_compliance_check.py
      - src/platform_tools/reconcile_remaining_work_merge.py
      - src/platform_tools/repo_health.py
      - src/platform_tools/rule_graph_check.py
      - src/platform_tools/remaining_work_graph_check.py
      - src/platform_tools/state_transition_legality.py
      - tests/test_anti_cheat_check.py
      - tests/test_branch_policy.py
      - tests/test_merge_readiness.py
      - tests/test_orchestrator_status.py
      - tests/test_policy_compliance_check.py
      - tests/test_reconcile_remaining_work_merge.py
      - tests/test_repo_health.py
      - tests/test_rule_graph_check.py
      - tests/test_remaining_work_graph_check.py
      - tests/test_state_transition_legality.py
  - id: exception_registry
    surface_class: exception_registry
    authority_role: human_only
    path_exact:
      - .agent/governance/exceptions.yaml
  - id: provider_projection_surface
    surface_class: projection_surface
    authority_role: projection_only
    path_prefixes:
      - artifacts/provider-sync/
      - src/platform_tools/integrations/

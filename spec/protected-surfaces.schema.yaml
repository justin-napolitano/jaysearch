version: v1
surface_entries:
  - id: execplan_surface
    surface_class: canonical_state_surface
    authority_role: canonical_local
    path_prefixes:
      - .agent/execplans/
  - id: remaining_work_graph_surface
    surface_class: canonical_state_surface
    authority_role: canonical_local
    path_exact:
      - artifacts/planner/research/remaining-work-graph.json
      - artifacts/planner/research/rule-graph.json
  - id: queue_projection_surface
    surface_class: projection_surface
    authority_role: projection_only
    path_exact:
      - docs/queued-execplans.md
  - id: governance_audit_surface
    surface_class: projection_surface
    authority_role: projection_only
    path_exact:
      - artifacts/governance/board-action-events.jsonl
      - artifacts/governance/worker-session-events.jsonl
      - artifacts/governance/worker-runtime-events.jsonl
  - id: worker_runtime_artifact_surface
    surface_class: canonical_state_surface
    authority_role: canonical_local
    path_prefixes:
      - artifacts/governance/staging-remotes/
      - artifacts/governance/worker-runs/
      - artifacts/governance/problems/
  - id: worker_session_lease_surface
    surface_class: canonical_state_surface
    authority_role: canonical_local
    path_prefixes:
      - artifacts/governance/worker-sessions/
  - id: worker_contract_registry_surface
    surface_class: canonical_state_surface
    authority_role: canonical_local
    path_prefixes:
      - artifacts/governance/initiative-worker-contracts/
  - id: rule_surface
    surface_class: rule_surface
    authority_role: governance_local
    path_exact:
      - docs/codex-orchestrator-contract.md
      - docs/governed-worker-runtime.md
      - docs/commands.md
      - docs/getting-started.md
      - docs/governance.md
      - docs/agent-game-rules-v1.md
      - docs/platform-definition-v1.md
      - docs/platform-overview.md
      - docs/repo-health.md
      - docs/rules-architecture.md
      - docs/subgame-branch-governance.md
      - docs/todos.md
      - pyproject.toml
      - spec/governance.yaml
      - spec/remaining-work-graph.schema.yaml
      - spec/rule-graph.schema.yaml
      - spec/rule-registry.yaml
      - spec/ruleset.yaml
      - spec/state-transition-legality.schema.yaml
      - spec/subgame-branch-contract.yaml
      - spec/worker-problem-artifact.schema.yaml
      - spec/worker-runtime-event.schema.yaml
      - spec/workflow.yaml
  - id: capability_policy_surface
    surface_class: capability_policy_surface
    authority_role: governance_local
    path_exact:

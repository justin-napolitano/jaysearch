version: v1
last_updated: 2026-03-19
lifecycle:
  - draft
  - proposed
  - approved
  - executing
  - completed
stop_conditions:
  - unresolved_required_check_failure
  - policy_breach_requires_escalation
  - draft_ttl_exceeded
  - execution_on_protected_branch
execution_requirements:
  shared_platform_board_has_inherited_global_law: true
  active_moves_must_satisfy_global_and_local_rules: true
  governed_slice_advancement_requires_referee_chain: true
  merge_readiness_is_proof_game: true
  universal_branch_first: true
  protected_branches_disallowed_for_execution:
    - main
    - master
  execution_branch_must_be_non_main: true
  parallel_execplans_require_distinct_implementation_branches: true
  queue_branches_are_integration_only: true
  workflow_branch_patterns:
    initiative: "initiative/*"
    draft_execplan: "draft-execplan/*"
    implementation_execplan: "impl-execplan/*"
    queue_execplan: "queue-execplan/*"
    hostile_review: "draft-execplan/hostile-review-*"
    docs: "docs/*"
    hotfix: "hotfix/*"
    release: "release/*"
  execution_branch_roles:
    initiative:
      purpose: "integrate one graph-backed initiative through child governed slices before merge to main"
      parent_integration_branch: true
      not_canonical_for_individual_slice_execution: true
    draft_execplan:
      purpose: "draft and review the ExecPlan artifact"
      not_canonical_for_slice_execution: true
    implementation_execplan:
      purpose: "execute one approved implementation ExecPlan slice"
      required_for_parallel_slice_execution: true
    queue_execplan:
      purpose: "stack already-executed slices for deliberate integration"
      not_canonical_for_individual_slice_execution: true
  finalization_requirements:
    governed_execplans_require_signed_merge_commit_on_main: true
    governed_execplans_merge_commit_is_canonical_finalization_event: true
  draft_review_requirements:
    governed_draft_execplans_require_dedicated_draft_branch: true
    governed_draft_execplans_require_agent_self_review_before_pr: true
    governed_draft_execplan_pr_requires_stable_template: true
    governed_draft_execplan_pr_template_mode: additive_only
    governed_draft_execplan_pr_required_sections:
      - execplan
      - purpose
      - scope
      - self_review
      - validation
      - handoff
    implementation_execution_requires_human_finalized_draft_execplan: true
    merged_draft_execplans_must_be_reflected_in_canonical_graph_and_queue_state: true
  initiative_requirements:
    governed_initiative_branches_require_parent_graph_node: true
    governed_initiative_branches_are_integration_only: true
    governed_child_slices_may_branch_from_initiative: true
    initiative_to_main_requires_parent_node_completion: true
    fail_closed_on_missing_initiative_mapping: true
    default_integration_mode: via_initiative
    optional_mainline_activation_signal_allowed: true
    mainline_activation_signal_meaning: completed_slice_is_not_operator_active_on_main_until_activation_evidence_exists
    direct_to_main_exception_modes:
      - direct_to_main_hotfix
      - direct_to_main_patch
    normal_governed_work_requires_initiative_branch: true
    transition_evidence_contract:
      draft_execplan_merge_to_main:
        source_branch_role: draft_execplan
        target_branch_role: main
        resulting_state: review_gated
      impl_execplan_merge_to_initiative:
        source_branch_role: implementation_execplan
        integration_mode: via_initiative
        target_branch_role: initiative
        resulting_state: completed
      impl_execplan_merge_to_main_exception:
        source_branch_role: implementation_execplan
        integration_modes:
          - direct_to_main_hotfix
          - direct_to_main_patch
        target_branch_role: main
        resulting_state: completed
      initiative_merge_to_main:
        source_branch_role: initiative
        target_branch_role: main
        resulting_state: completed
  board_runtime_requirements:
    board_review_surface_is_projection_only: true
    provider_sync_field_map_required_for_live_board_sync: true
    existing_project_id_requires_board_reuse: true
    existing_item_ids_require_update_preference: true
    human_operations_runtime_must_be_takeover_safe: true
  managed_repo_requirements:
    target_repo_owns_canonical_state: true
    platform_repo_owns_runtime: true
    external_root_targeting_must_fail_closed: true
    platform_owned_bootstrap_required: true
    bootstrap_command: bin/bootstrap-managed-repo
    bootstrap_must_be_human_runnable_without_codex: true
    github_project_bootstrap_via_runtime_code_required: true
    managed_repo_board_must_show_completion_pr_projection: true
    lightweight_required_artifacts:
      - spec/workflow.yaml
      - artifacts/planner/research/remaining-work-graph.json
      - docs/queued-execplans.md
      - .agent/execplans
      - artifacts/provider-sync/github-projects-field-map.json
    lightweight_branch_policy_fields:
      - allowed_branch_patterns
      - forbidden_branches
  local_hook_requirements:
    versioned_local_hooks_required: true
    configured_hooks_path: .githooks
    installer_command: bin/install-local-git-hooks
    post_merge_command: bin/auto-reconcile-main
    post_checkout_command: bin/auto-reconcile-main
    pre_push_command: bin/run-governed-pre-push-checks
    mutating_hooks:
      - post-merge
      - post-checkout
    validation_only_hooks:
      - pre-push
    hooks_must_invoke_repo_owned_commands_only: true
    hooks_must_noop_on_ineligible_branches: true
  queue_reconciliation_requirements:
    graph_actions_required_for_governed_work: true
    stale_queue_blocks_advancement: true
    queue_and_graph_must_reconcile_before_next_slice: true
  referee_order:
    - global_board_law
    - active_domain_game
    - active_subgame
platform_execution_order:
  - 20260304-platform-validator-jay-execplan
  - 20260304-todo-automation-jay-execplan
  - 20260304-repo-health-engine-jay-execplan
  - 20260304-spec-test-runner-jay-execplan
human_authority:
  finalization_is_human_only: true
  ssh_signed_commit_required: true
  override_requires_decision_log_entry: true

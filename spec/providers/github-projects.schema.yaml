version: v1
last_updated: 2026-03-11
provider: github_projects
projection_kind: remaining_work_board
board_model:
  board_scope: remaining_work_graph
  item_identity_field: node_id
  item_type: slice_node
  default_title: "Platform Execution Board"
  default_description: "Canonical remaining-work projection for governed execution."
required_board_fields:
  - node_id
  - title
  - target_execplan_id
  - status
  - gating_class
  - implementation_branch
  - goal_area
  - dependency_summary
  - human_review_state
field_map:
  node_id: text
  title: title
  target_execplan_id: text
  status: single_select
  gating_class: single_select
  implementation_branch: text
  goal_area: single_select
  dependency_summary: text
  human_review_state: single_select
  pr_url: text
  validation_status: single_select
  smoke_status: single_select
  merge_readiness: single_select
  finalization_state: single_select
status_options:
  - ready
  - blocked
  - review_gated
  - decision_gated
  - completed
gating_class_options:
  - auto_runnable
  - review_gated
  - decision_gated
goal_area_options:
  - governance
  - runtime-governance
  - provider-sync
  - orchestrator-runtime
  - integration
human_review_state_options:
  - not_requested
  - ready_for_review
  - in_review
  - merged
validation_status_options:
  - pending
  - passed
  - failed
smoke_status_options:
  - pending
  - passed
  - failed
merge_readiness_options:
  - local_only
  - ready
  - blocked
finalization_state_options:
  - not_finalized
  - merged_to_main
invariants:
  - one_board_per_remaining_work_graph_projection
  - not_one_board_per_execplan
  - remote_items_are_views_not_authorities
bootstrap:
  supports_project_creation: true
  supports_field_creation: true
  emits_field_map_contract: github_projects_sync_v1
  default_field_map_output_path: artifacts/provider-sync/github-projects-field-map.json
  provider_managed_fields:
    - status
sync:
  field_map_contract: github_projects_sync_v1
  provider_managed_value_map:
    status:
      ready: Todo
      blocked: In Progress
      review_gated: In Progress
      decision_gated: In Progress
      completed: Done
  field_value_map:
    goal_area:
      orchestrator-status: orchestrator-runtime
      implementation-orchestrator: orchestrator-runtime
      game-graph: runtime-governance

$schema: "https://json-schema.org/draft/2020-12/schema"
title: "Public Orchestration API v1"
description: "Versioned request and response contract catalog for the thin orchestration facade."
type: object
additionalProperties: true
required:
  - api_version
  - command
  - status
  - ok
properties:
  api_version:
    type: string
    const: "public-orchestration.v1"
  command:
    type: string
    enum:
      - "get-graph-state"
      - "get-research-run-history"
      - "get-worker-status"
      - "materialize-research-followup-assets"
      - "render-researcher-followup-handoffs"
      - "render-platform-execplan-drafts"
      - "project-research-followup-packets"
      - "prepare-research-followups"
      - "run-research-capability"
      - "run-research-improvement-loop"
      - "resolve-worker-contract"
      - "run-worker-contract"
      - "start-next-worker"
  status:
    type: string
    enum:
      - "ok"
      - "blocked"
  ok:
    type: boolean
$defs:
  graph_node_projection:
    type: object
    additionalProperties: false
    required:
      - node_id
      - title
      - status
      - execplan_id
      - initiative_branch
      - implementation_branch
      - goal_area
    properties:
      node_id:
        type: string
      title:
        type: string
      status:
        type: string
      execplan_id:
        type: string
      initiative_branch:
        type: string
      implementation_branch:
        type: string
      goal_area:
        type: string
  worker_contract_projection:
    type: object
    additionalProperties: false
    required:
      - contract_id
      - execplan_id
      - branch
      - worker_id
      - title
    properties:
      contract_id:
        type: string
      execplan_id:
        type: string
      branch:
        type: string
      worker_id:
        type: string
      title:
        type: string
      status:
        type: string
  worker_contract_run_projection:
    type: object
    additionalProperties: false
    required:
      - contract_id
      - execplan_id
      - implementation_branch
      - worker_id
      - title
    properties:
      contract_id:
        type: string
      execplan_id:
        type: string
      implementation_branch:
        type: string
      worker_id:
        type: string
      title:
        type: string
  request_get_graph_state:
    type: object
    additionalProperties: false
    properties:
      initiative_branch:
        type: string
  response_get_graph_state:
    allOf:
      - $ref: "#"
      - type: object
        additionalProperties: true
        required:
          - initiative_branch
          - graph_id
          - last_action_id
          - counts
          - initiative_nodes
          - active_node
          - queued_nodes
        properties:
          command:
            const: "get-graph-state"
          initiative_branch:
            type: string
          graph_id:
            type: string
          last_action_id:
            type: string
          counts:
            type: object
            additionalProperties: false
            required:
              - nodes
              - completed
              - pending
            properties:
              nodes:
                type: integer
              completed:
                type: integer
              pending:
                type: integer
          initiative_nodes:
            type: array
            items:
              $ref: "#/$defs/graph_node_projection"
          active_node:
            oneOf:
              - type: "null"
              - $ref: "#/$defs/graph_node_projection"
          queued_nodes:
            type: array
            items:
              $ref: "#/$defs/graph_node_projection"
  request_resolve_worker_contract:
    type: object
    additionalProperties: false
    properties:
      initiative_branch:
        type: string
      contract_id:
        type: string
      branch:
        type: string
      worker_id:
        type: string
  response_resolve_worker_contract:
    allOf:
      - $ref: "#"
      - type: object
        additionalProperties: true
        required:
          - initiative_branch
        properties:
          command:
            const: "resolve-worker-contract"
          initiative_branch:
            type: string
          blockers:
            type: array
            items:
              type: string
  request_get_research_run_history:
    type: object
    additionalProperties: false
    properties:
      request_id:
        type: string
      status:
        type: string
      limit:
        type: integer
      history_log_path:
        type: string
  response_get_research_run_history:
    allOf:
      - $ref: "#"
      - type: object
        additionalProperties: true
        required:
          - history_log_path
          - blockers
        properties:
          command:
            const: "get-research-run-history"
          request_id:
            type: string
          status_filter:
            type: string
          limit:
            type: integer
          count:
            type: integer
          counts_by_status:
            type: object
            additionalProperties:
              type: integer
          history_log_path:
            type: string
          recent_runs:
            type: array
            items:
              type: object
          blockers:
            type: array
            items:
              type: string
          candidates:
            type: array
            items:
              type: object
          selected:
            $ref: "#/$defs/worker_contract_projection"
  request_run_worker_contract:
    type: object
    additionalProperties: false
    properties:
      initiative_branch:
        type: string
      contract_id:
        type: string
      branch:
        type: string
      worker_id:
        type: string
      executor:
        type: string
        enum:
          - "local_clone"
          - "local_worktree"
      push_mode:
        type: string
        enum:
          - "none"
          - "staging"
          - "github"
          - "staging_and_github"
      github_push_remote:
        type: string
      task_command:
        type: string
      commit_message:
        type: string
      pr_title:
        type: string
      pr_body:
        type: string
      draft_pr:
        type: boolean
      commit:
        type: boolean
      create_pr:
        type: boolean
      cleanup:
        type: boolean
      actor_id:
        type: string
      workspace_root:
        type: string
      stale_after_minutes:
        type: integer
  response_run_worker_contract:
    allOf:
      - $ref: "#"
      - type: object
        additionalProperties: true
        required:
          - executor
          - push_mode
        properties:
          command:
            const: "run-worker-contract"
          initiative_branch:
            type: string
          executor:
            type: string
          push_mode:
            type: string
          blockers:
            type: array
            items:
              type: string
          selected:
            oneOf:
              - $ref: "#/$defs/worker_contract_run_projection"
              - type: object
          resolution:
            type: object
          worker_run:
            type: object
  request_start_next_worker:
    type: object
    additionalProperties: false
    properties:
      initiative_branch:
        type: string
      executor:
        type: string
        enum:
          - "local_clone"
          - "local_worktree"
      push_mode:
        type: string
        enum:
          - "none"
          - "staging"
          - "github"
          - "staging_and_github"
      github_push_remote:
        type: string
      task_command:
        type: string
      commit_message:
        type: string
      pr_title:
        type: string
      pr_body:
        type: string
      draft_pr:
        type: boolean
      commit:
        type: boolean
      create_pr:
        type: boolean
      cleanup:
        type: boolean
      actor_id:
        type: string
      workspace_root:
        type: string
      stale_after_minutes:
        type: integer
  response_start_next_worker:
    allOf:
      - $ref: "#"
      - type: object
        additionalProperties: true
        required:
          - initiative_branch
          - resolution
        properties:
          command:
            const: "start-next-worker"
          initiative_branch:
            type: string
          blockers:
            type: array
            items:
              type: string
          resolution:
            type: object
          worker_run:
            type: object
  request_get_worker_status:
    type: object
    additionalProperties: false
    properties:
      worker_id:
        type: string
      stale_after_minutes:
        type: integer
  response_get_worker_status:
    allOf:
      - $ref: "#"
      - type: object
        additionalProperties: true
        properties:
          command:
            const: "get-worker-status"
          worker_id:
            type: string
          counts:
            type: object
          active_workers:
            type: array
            items:
              type: object
          failed_workers:
            type: array
            items:
              type: object
          abandoned_workers:
            type: array
            items:
              type: object
          recent_runs:
            type: array
            items:
              type: object
          blockers:
            type: array
            items:
              type: string
  request_run_research_capability:
    type: object
    additionalProperties: false
    required:
      - researcher_root
      - request_path
    properties:
      researcher_root:
        type: string
      request_path:
        type: string
      python_executable:
        type: string
  response_run_research_capability:
    allOf:
      - $ref: "#"
      - type: object
        additionalProperties: true
        required:
          - researcher_root
          - request_path
          - blockers
        properties:
          command:
            const: "run-research-capability"
          researcher_root:
            type: string
          request_path:
            type: string
          request_id:
            type: string
          research_status:
            type: string
          output_root:
            type: string
          recommendation:
            type: string
          summary_path:
            type: string
          self_review_path:
            type: string
          improvement_proposal_path:
            type: string
          improvement_proposal_json_path:
            type: string
          improvement_candidates_path:
            type: string
          improvement_targets:
            type: array
            items:
              type: string
          improvement_observed_gaps:
            type: array
            items:
              type: string
          improvement_proposals:
            type: array
            items:
              type: object
          question_origin:
            type: string
          ranked_candidates:
            type: array
            items:
              type: object
          promotable_candidates:
            type: array
            items:
              type: object
          follow_up_questions:
            type: array
            items:
              type: object
          artifact_paths:
            type: object
            additionalProperties:
              type: string
          warnings:
            type: array
            items:
              type: string
          blockers:
            type: array
            items:
              type: string
  request_prepare_research_followups:
    type: object
    additionalProperties: false
    required:
      - report_path
      - output_root
    properties:
      report_path:
        type: string
      output_root:
        type: string
      max_promotions:
        type: integer
        minimum: 1
      minimum_total_score:
        type: number
        exclusiveMinimum: 0
  response_prepare_research_followups:
    allOf:
      - $ref: "#"
      - type: object
        additionalProperties: true
        required:
          - report_path
          - output_root
          - blockers
        properties:
          command:
            const: "prepare-research-followups"
          report_path:
            type: string
          output_root:
            type: string
          source_request_id:
            type: string
          source_question_id:
            type: string
          source_question_origin:
            type: string
          promotion_gate:
            type: object
            additionalProperties: false
            properties:
              minimum_rigor:
                type: number
              minimum_feasibility:
                type: number
              minimum_total_score:
                type: number
          max_promotions:
            type: integer
          draft_followups_path:
            type: string
          selected_candidates:
            type: array
            items:
              type: object
          deferred_candidates:
            type: array
            items:
              type: object
          follow_up_questions:
            type: array
            items:
              type: object
          next_action:
            type: string
          blockers:
            type: array
            items:
              type: string
  request_project_research_followup_packets:
    type: object
    additionalProperties: false
    required:
      - prepared_followups_path
      - output_root
    properties:
      prepared_followups_path:
        type: string
      output_root:
        type: string
  response_project_research_followup_packets:
    allOf:
      - $ref: "#"
      - type: object
        additionalProperties: true
        required:
          - prepared_followups_path
          - output_root
          - blockers
        properties:
          command:
            const: "project-research-followup-packets"
          prepared_followups_path:
            type: string
          output_root:
            type: string
          source_request_id:
            type: string
          source_question_id:
            type: string
          source_question_origin:
            type: string
          packets_path:
            type: string
          platform_execplan_seeds:
            type: array
            items:
              type: object
          repo_followup_requests:
            type: array
            items:
              type: object
          next_action:
            type: string
          blockers:
            type: array
            items:
              type: string
  request_materialize_research_followup_assets:
    type: object
    additionalProperties: false
    required:
      - packets_path
      - output_root
    properties:
      packets_path:
        type: string
      output_root:
        type: string
  response_materialize_research_followup_assets:
    allOf:
      - $ref: "#"
      - type: object
        additionalProperties: true
        required:
          - packets_path
          - output_root
          - blockers
        properties:
          command:
            const: "materialize-research-followup-assets"
          packets_path:
            type: string
          output_root:
            type: string
          source_request_id:
            type: string
          source_question_id:
            type: string
          source_question_origin:
            type: string
          manifest_path:
            type: string
          platform_seed_files:
            type: array
            items:
              type: object
          repo_request_files:
            type: array
            items:
              type: object
          next_action:
            type: string
          blockers:
            type: array
            items:
              type: string
  request_render_platform_execplan_drafts:
    type: object
    additionalProperties: false
    required:
      - materialized_manifest_path
      - output_root
    properties:
      materialized_manifest_path:
        type: string
      output_root:
        type: string
  response_render_platform_execplan_drafts:
    allOf:
      - $ref: "#"
      - type: object
        additionalProperties: true
        required:
          - materialized_manifest_path
          - output_root
          - blockers
        properties:
          command:
            const: "render-platform-execplan-drafts"
          materialized_manifest_path:
            type: string
          output_root:
            type: string
          source_request_id:
            type: string
          source_question_id:
            type: string
          source_question_origin:
            type: string
          draft_manifest_path:
            type: string
          draft_files:
            type: array
            items:
              type: object
          next_action:
            type: string
          blockers:
            type: array
            items:
              type: string
  request_render_researcher_followup_handoffs:
    type: object
    additionalProperties: false
    required:
      - materialized_manifest_path
      - output_root
    properties:
      materialized_manifest_path:
        type: string
      output_root:
        type: string
  response_render_researcher_followup_handoffs:
    allOf:
      - $ref: "#"
      - type: object
        additionalProperties: true
        required:
          - materialized_manifest_path
          - output_root
          - blockers
        properties:
          command:
            const: "render-researcher-followup-handoffs"
          materialized_manifest_path:
            type: string
          output_root:
            type: string
          source_request_id:
            type: string
          source_question_id:
            type: string
          source_question_origin:
            type: string
          handoff_manifest_path:
            type: string
          handoff_files:
            type: array
            items:
              type: object
          next_action:
            type: string
          blockers:
            type: array
            items:
              type: string
  request_run_research_improvement_loop:
    type: object
    additionalProperties: false
    required:
      - researcher_root
      - request_path
      - output_root
    properties:
      researcher_root:
        type: string
      request_path:
        type: string
      output_root:
        type: string
      python_executable:
        type: string
      max_promotions:
        type: integer
      minimum_total_score:
        type: number
  response_run_research_improvement_loop:
    allOf:
      - $ref: "#"
      - type: object
        additionalProperties: true
        required:
          - researcher_root
          - request_path
          - output_root
          - blockers
        properties:
          command:
            const: "run-research-improvement-loop"
          researcher_root:
            type: string
          request_path:
            type: string
          output_root:
            type: string
          request_id:
            type: string
          step_reports:
            type: array
            items:
              type: object
          draft_followups_path:
            type: string
          packets_path:
            type: string
          materialized_manifest_path:
            type: string
          draft_manifest_path:
            type: string
          handoff_manifest_path:
            type: string
          loop_manifest_path:
            type: string
          history_log_path:
            type: string
          history_entry_path:
            type: string
          run_id:
            type: string
          recorded_at:
            type: string
          failed_step:
            type: string
          next_action:
            type: string
          blockers:
            type: array
            items:
              type: string
  command_catalog:
    type: object
    additionalProperties: false
    properties:
      get-graph-state:
        type: object
        additionalProperties: false
        properties:
          request_schema:
            const: "#/$defs/request_get_graph_state"
          response_schema:
            const: "#/$defs/response_get_graph_state"
      get-research-run-history:
        type: object
        additionalProperties: false
        properties:
          request_schema:
            const: "#/$defs/request_get_research_run_history"
          response_schema:
            const: "#/$defs/response_get_research_run_history"
      resolve-worker-contract:
        type: object
        additionalProperties: false
        properties:
          request_schema:
            const: "#/$defs/request_resolve_worker_contract"
          response_schema:
            const: "#/$defs/response_resolve_worker_contract"
      run-worker-contract:
        type: object

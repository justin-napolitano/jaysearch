        additionalProperties: false
        properties:
          request_schema:
            const: "#/$defs/request_render_researcher_followup_handoffs"
          response_schema:
            const: "#/$defs/response_render_researcher_followup_handoffs"
      run-research-improvement-loop:
        type: object
        additionalProperties: false
        properties:
          request_schema:

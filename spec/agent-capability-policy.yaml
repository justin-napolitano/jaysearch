denial_rules:
  - id: agent_exception_self_authorization
    blocker: agent_exception_self_authorization_denied
    surface_class: exception_registry
  - id: github_authority_promotion
    blocker: github_authority_promotion_denied
    required_projection_only_fields:
      - spec/board-action-api.yaml:authority_model.github_projects_authority
      - spec/governance.yaml:board_review_runtime.authority_mode

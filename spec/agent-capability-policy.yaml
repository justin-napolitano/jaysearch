version: v1
actor_classes:
  - id: human
    label: Human operator
  - id: agent
    label: Governed automation agent
  - id: referee
    label: Local referee
branch_classes:
  - id: impl_execplan
  - id: draft_execplan
  - id: queue_execplan
  - id: other
goal_area_classes:
  - id: governance
  - id: non_governance
capability_rules:
  - id: agent_draft_governance
    actor_class: agent
    branch_class: draft_execplan
    goal_area_class: governance
    allowed_surface_classes:
      - canonical_state_surface
      - projection_surface
    forbidden_surface_classes:
      - rule_surface
      - referee_surface
      - capability_policy_surface
      - exception_registry
    allowed_referee_paths: []
    requires_execplan_declaration_for_protected_surfaces: true
  - id: agent_impl_non_governance
    actor_class: agent
    branch_class: impl_execplan
    goal_area_class: non_governance
    allowed_surface_classes:
      - canonical_state_surface
      - projection_surface
    forbidden_surface_classes:
      - rule_surface
      - referee_surface
      - capability_policy_surface
      - exception_registry
    allowed_referee_paths: []
    requires_execplan_declaration_for_protected_surfaces: true
  - id: agent_impl_governance
    actor_class: agent
    branch_class: impl_execplan
    goal_area_class: governance
    allowed_surface_classes:
      - canonical_state_surface
      - projection_surface
      - capability_policy_surface
      - referee_surface
    forbidden_surface_classes:
      - exception_registry
    allowed_referee_paths:
      - .githooks/post-checkout
      - .githooks/post-merge
      - .githooks/pre-push
      - bin/auto-reconcile-main
      - bin/install-local-git-hooks
      - bin/anti-cheat-check
      - bin/bootstrap-managed-repo
      - bin/bootstrap-session
      - bin/governed-worker

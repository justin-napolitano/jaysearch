      - bin/reconcile-worker-runtime-graph
      - bin/worker-session-coordinator
      - bin/worker-session-status
      - bin/managed-repo-status
      - bin/merge-readiness-check
      - bin/orchestrate-governed-slice
      - bin/post-merge-graph-reconciliation-smoke-test
      - bin/policy-compliance-check
      - bin/register-remaining-work-node
      - bin/reconcile-pending-merge-completions
      - bin/reconcile-governed-graph-events
      - bin/reconcile-remaining-work-transition
      - bin/rule-graph-check
      - bin/run-governed-pre-push-checks

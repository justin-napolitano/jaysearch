version: v1
last_updated: 2026-03-26
required_checks:
  name_regex: "^[a-z][a-z0-9_]*$"
  contract:
    - check_id: execplan_validate
      command: bin/execplan-validate .agent/execplans/*.md
      expected_exit: 0
    - check_id: sync_todos
      command: bin/sync-todos
      expected_exit: 0
    - check_id: repo_health_check
      command: bin/repo-health-check
      expected_exit: 0
    - check_id: execplan_spec_tests
      command: bin/execplan-test
      expected_exit: 0
    - check_id: run_local_ci
      command: bin/run-local-ci
      expected_exit: 0
exception_lifecycle:
  registry_path: .agent/governance/exceptions.yaml
  required_fields:
    - id
    - scope
    - owner
    - rationale
    - approved_by
    - created_at
    - expires_at
    - status
    - bypass_evidence
  statuses:
    - active
    - expired
    - revoked
  renewal_window_days: 7
  bypass_evidence_min_items: 1
finalization:
  canonical_event: signed_merge_commit_on_main
  inflight_authority_source: initiative_branch_execplan
  signed_mainline_finalization_role: historical_approval_and_completion
  allowed_signature_statuses:
    - G
  derived_fields:
    - finalized_by
    - finalized_at
    - finalized_in_pr
  completion_status: completed
  preferred_merge_branch_role_order:
    - impl-execplan
    - draft-execplan
  ambiguity_policy: block
  signer_identity_map:
    - github: github:jay.napolitano
      emails:
        - jay.napolitano@adventhealth.com
      signer_names:
        - Jay Napolitano
      signer_fingerprints: []
board_review_runtime:
  authority_mode: projection_only
  field_map_required_for_live_sync: true
  existing_project_id_requires_reuse: true
  known_item_ids_require_update_preference: true
  takeover_state_must_be_machine_readable: true
remaining_work_ordering:
  canonical_source: remaining_work_graph
  queue_projection_authority: projection_only
  reorder_requires_graph_action: true
  stale_queue_blocks_advancement: true
